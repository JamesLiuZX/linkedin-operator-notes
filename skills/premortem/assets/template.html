<script id="premortem-data" type="application/json">
{
 "title": "Replace this JSON with your premortem.json",
 "plan": {
  "name": "The plan",
  "summary": "This page is drawn from the JSON in the element with id premortem-data. The format is in references/format.md.",
  "ships": "When, and to whom",
  "goal": "What it is meant to change."
 },
 "asOf": "2026-01-05",
 "failedOn": "2026-07-06",
 "inputs": [
  {
   "id": "N",
   "label": "Your notes",
   "detail": "replace me"
  }
 ],
 "risks": [
  {
   "id": "R1",
   "area": "users",
   "title": "The failure, named in a few words",
   "story": "Who does what, and what follows from it. Two or three sentences that someone outside the team could repeat back to you after reading them once.",
   "likelihood": "medium",
   "likelihoodWhy": "Why you think it is this likely.",
   "impact": "high",
   "impactWhy": "Why it would matter this much.",
   "evidence": {
    "status": "unknown",
    "expect": "What you would see if it were real."
   },
   "tripwire": {
    "metric": "A metric the team already has",
    "threshold": "Rises above 10",
    "check": "2026-02-02",
    "owner": "A role or a name"
   },
   "mitigation": "The change to the plan that would help.",
   "test": "The cheapest test that would settle it."
  }
 ],
 "top": [
  "R1"
 ],
 "skipped": {
  "behaviour": "Say why this area has no risk.",
  "operations": "Say why this area has no risk.",
  "money": "Say why this area has no risk.",
  "rules": "Say why this area has no risk.",
  "build": "Say why this area has no risk."
 }
}

<script>(()=>{var e=s=>String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;"),g=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],E=["January","February","March","April","May","June","July","August","September","October","November","December"],b=s=>/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""),f=s=>{let t=b(s);return t?`${Number(t[3])} ${g[Number(t[2])-1]} ${t[1]}`:e(s||"")},L=s=>{let t=b(s);return t?`${Number(t[3])} ${E[Number(t[2])-1]} ${t[1]}`:e(s||"")},y=[["users","Users"],["behaviour","Behaviour"],["operations","Operations"],["money","Money"],["rules","Rules"],["build","Build"]],k=Object.fromEntries(y),m=["low","medium","high"],$={supported:["Evidence for","ink"],contradicted:["Evidence against","ok"],unknown:["A guess","warn"]},h=s=>`<span class="pm-lv pm-${e(s)}"><i></i><i></i><i></i></span>`;function O(s,t){let a=s.evidence||{},[n,o]=$[a.status]||$.unknown,c=a.from&&t[a.from]?t[a.from].label:"";return`<div class="pm-ev">

    ${a.detail?`<p>${e(a.detail)}</p>`:a.status==="unknown"?"<p>Nothing in the inputs speaks to this either way.</p>":""}
    ${a.expect?`<p class="pm-expect"><span>If it is real, you would see</span> ${e(a.expect)}</p>`:""}
  </div>`}function N(s,t,a){let n=s.tripwire||{};return`<article class="pm-risk" data-risk="${e(s.id)}" id="${e(s.id)}">
    <div class="pm-risk-head">
      <span class="pm-rank">${t}</span>
      <div>
        <div class="pm-meta"><span class="aid">${e(s.id)}</span><span class="atag">${e(k[s.area]||s.area)}</span></div>
        <h2>${e(s.title)}</h2>
      </div>
      <dl class="pm-li">
        <div><dt>Likelihood</dt><dd>${h(s.likelihood)}<b>${e(s.likelihood)}</b></dd></div>
        <div><dt>Impact</dt><dd>${h(s.impact)}<b>${e(s.impact)}</b></dd></div>
      </dl>
    </div>
    <p class="pm-story">${e(s.story)}</p>
    ${O(s,a)}
    <div class="pm-wire" data-wire="${e(s.id)}">
      <span class="pm-k">Tripwire</span>
      <div class="pm-wire-grid">
        <div class="wide"><span>Watch</span><b>${e(n.metric||"")}</b></div>
        <div class="wide"><span>Trips when</span><b>${e(n.threshold||"")}</b></div>
        <div><span>Look on</span><b>${f(n.check)}</b></div>
        <div><span>Who looks</span><b>${e(n.owner||"")}</b></div>
      </div>
    </div>
    ${s.mitigation||s.test?`<div class="pm-do">
      ${s.mitigation?`<div><span class="pm-k">Change to the plan</span><p>${e(s.mitigation)}</p></div>`:""}
      ${s.test?`<div><span class="pm-k">Cheapest test before launch</span><p>${e(s.test)}</p></div>`:""}
    </div>`:""}
  </article>`}function A(s,t){let[a,n]=$[s.evidence?.status]||$.unknown;return`<details class="pm-row" data-risk="${e(s.id)}" id="${e(s.id)}">
    <summary>
      <span class="aid ink">${e(s.id)}</span>
      <span class="pm-row-title">${e(s.title)}</span>
      <span class="atag">${e(k[s.area]||s.area)}</span>
      <span class="atag ${n}">${a}</span>
      <span class="pm-row-li" title="Likelihood ${e(s.likelihood)}, impact ${e(s.impact)}">${h(s.likelihood)}${h(s.impact)}</span>
    </summary>
    <div class="pm-row-body">
      <p class="pm-story">${e(s.story)}</p>
      <p class="pm-why"><b>Likelihood ${e(s.likelihood)}.</b> ${e(s.likelihoodWhy||"")} <b>Impact ${e(s.impact)}.</b> ${e(s.impactWhy||"")}</p>
      ${O(s,t)}
      ${s.mitigation?`<p class="pm-why"><b>What would help.</b> ${e(s.mitigation)}</p>`:""}
    </div>
  </details>`}function S(s,t){let a=(o,c)=>s.filter(r=>r.likelihood===o&&r.impact===c);return`<div class="pm-matrix" data-part="matrix">
    <span class="pm-axis-y">Impact</span>
    <div class="pm-cells">
      ${[...m].reverse().map(o=>m.map(c=>`<div class="pm-cell h${m.indexOf(c)+m.indexOf(o)}" data-cell="${c}-${o}">${a(c,o).map(l=>`<a href="#${e(l.id)}" class="aid${t.includes(l.id)?"":" ghost"}" data-chip="${e(l.id)}" title="${e(l.title)}">${e(l.id)}</a>`).join("")}</div>`).join("")).join("")}
    </div>

  </div>`}function I(s){let t=s.risks||[],a=(s.top||[]).filter(i=>t.some(p=>p.id===i)),n=Object.fromEntries(t.map(i=>[i.id,i])),o=Object.fromEntries((s.inputs||[]).map(i=>[i.id,i])),c=t.filter(i=>!a.includes(i.id)),r=i=>t.filter(p=>(p.evidence?.status||"unknown")===i).length,l=a.map(i=>n[i]).filter(i=>i.tripwire&&i.tripwire.check).sort((i,p)=>String(i.tripwire.check).localeCompare(String(p.tripwire.check))),v=s.skipped||{},d=s.plan||{};return`
  <div class="pm-wrap">
    <header class="pm-head">
      <div class="pm-ey">Pre-mortem${s.asOf?` \xB7 written ${f(s.asOf)}`:""}</div>
      <h1>${e(s.title||d.name||"Pre-mortem")}</h1>
      <p class="pm-premise">It is <mark>${L(s.failedOn)}</mark>. The plan shipped, and it went badly. These are the reasons, written while the plan can still change.</p>
      <div class="pm-plan">
        <div class="wide"><span class="pm-k">The plan</span><p><b>${e(d.name||"")}.</b> ${e(d.summary||"")}</p></div>
        ${d.ships?`<div><span class="pm-k">Ships</span><p>${e(d.ships)}</p></div>`:""}
        ${d.goal?`<div><span class="pm-k">Meant to change</span><p>${e(d.goal)}</p></div>`:""}
      </div>
    </header>

    <section class="pm-over" data-part="map">
      ${S(t,a)}
      <div class="pm-side">
        <div class="pm-tally" data-part="tally">
          <div><b>${t.length}</b><span>risks</span></div>
          <div><b>${a.length}</b><span>with a tripwire</span></div>
          <div><b>${r("unknown")}</b><span>are guesses</span></div>
        </div>
        <div class="pm-areas">

    </section>

    ${l.length?`<section class="pm-cal" data-part="calendar">
