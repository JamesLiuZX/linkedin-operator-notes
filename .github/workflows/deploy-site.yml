name: Deploy site

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "articles/**"
      - "scripts/**"
      - "posts/**"
  # Lets the site be deployed from a feature branch before it merges.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm --prefix site ci

      # Gate scores are read by the site and decide what is publishable, so
      # they are regenerated from the content on every deploy rather than
      # committed and left to drift.
      - run: node scripts/gate-scores.mjs
      - run: node scripts/build-apps.mjs

      - run: BASE_PATH=/linkedin-operator-notes/ npm --prefix site run build
      - name: SPA fallback
        run: cp site/dist/index.html site/dist/404.html

      # Without this the deployed site ships no sitemap.xml or robots.txt at
      # all; build-seo.mjs used to run only in the CI compile check, which
      # deploys nothing. SITE_URL (repo secret) wins when set; the Pages URL
      # is the fallback so the sitemap is absolute either way.
      - name: Sitemap and robots
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node scripts/build-seo.mjs --base "${SITE_URL:-https://jamesliuzx.github.io/linkedin-operator-notes}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
