name: Deploy site

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "articles/**"
      - "scripts/lib/**"
      - "posts/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm --prefix site ci
      - run: BASE_PATH=/linkedin-operator-notes/ npm --prefix site run build
      - name: SPA fallback
        run: cp site/dist/index.html site/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
